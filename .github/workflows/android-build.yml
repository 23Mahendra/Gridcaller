name: Android APK Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - uses: android-actions/setup-android@v3

      - name: Validate Android build toolchain
        run: |
          java -version
          bash android/gradlew --version
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          grep -E "distributionUrl=.*gradle-[0-9.]+-(all|bin)\.zip" android/gradle/wrapper/gradle-wrapper.properties

      - name: Verify generated Android project
        run: |
          test -f android/app/capacitor.build.gradle
          test -f android/capacitor.settings.gradle
          test -f android/app/src/main/AndroidManifest.xml

      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm run cap:sync
      - run: cd android && bash ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: GridCaller-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/*.apk